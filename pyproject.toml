[project]
name = "gamegrammar"
version = "0.1.0"
description = "Generative Ontology for Board Game Design using DSPy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dspy>=2.5",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
gamegrammar = "gamegrammar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamegrammar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
